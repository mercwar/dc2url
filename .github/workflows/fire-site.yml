name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run fire-site.sh
        run: |
          if [ -f "./fire-site.sh" ]; then
            bash ./fire-site.sh
          elif [ -f "./sitemap.sh" ]; then
            bash ./sitemap.sh
          else
            echo "Error: Neither fire-site.sh nor sitemap.sh found in repository root."
            exit 1
          fi

      - name: Commit and push sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap.xml"
          else
            git commit -m "Update sitemap.xml"
            git push
          fi
