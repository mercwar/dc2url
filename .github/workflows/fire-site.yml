name: "MERCWAR :: SITE-MAP-DISPATCH"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  sentinel-dispatch:
    name: "MERCWAR :: Sentinel Dispatch"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "MERCWAR :: Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "MERCWAR :: Repair All Submodule Mappings"
        run: |
          git ls-files --stage | awk '$1 == "160000" {print $4}' | while read -r path; do
            if ! git config -f .gitmodules --get "submodule.${path}.url" >/dev/null 2>&1; then
              name=$(basename "$path")
              git config -f .gitmodules "submodule.${path}.path" "$path"
              git config -f .gitmodules "submodule.${path}.url" "https://github.com{name}.git"
            fi
          done
          if [ -f ".gitmodules" ]; then
            git submodule sync
          fi

      - name: "MERCWAR :: Execute Sitemap Script"
        run: |
          cd "${GITHUB_WORKSPACE}"

          if [ -f "./fire-site.sh" ]; then
            chmod +x ./fire-site.sh
            ./fire-site.sh
          else
            echo "::error::MERCWAR FATAL: fire-site.sh NOT FOUND at $(pwd)"
            ls -la
            exit 1
          fi

      - name: "MERCWAR :: Commit & Push"
        run: |
          git config user.name "MERCWAR-Automaton"
          git config user.email "mercwar@github.local"

          git add sitemap.xml
          if [ -f ".gitmodules" ]; then
            git add .gitmodules
          fi

          if ! git diff --staged --quiet; then
            git commit -m "MERCWAR: Automated sitemap & submodule mapping update [skip ci]"
            git push
          else
            echo "MERCWAR: No changes to commit."
          fi
